<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Dharma Visualizer PRO</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<!-- ===========================
BACKGROUND
=========================== -->

<div id="background"></div>

<!-- ===========================
OVERLAY
=========================== -->

<div id="overlay"></div>

<!-- ===========================
MAIN CONTAINER
=========================== -->

<div id="app">

    <!-- Logo -->

    <div id="logoArea">

        <img id="logo" src="assets/images/logo.png" alt="Logo">

    </div>

    <!-- Main Title -->

    <h1 id="title">

        නිවනට මග

    </h1>

    <!-- Subtitle -->

    <p id="subtitle">

        ශ්‍රී සද්ධර්ම දේශනා

    </p>

    <!-- Visualizer -->

    <div id="visualizerContainer">

        <canvas id="visualizerCanvas"></canvas>

    </div>

    <!-- Audio Player -->

    <audio id="audio" controls></audio>

    <!-- Progress -->

    <div id="progressArea">

        <span id="currentTime">00:00</span>

        <input
            type="range"
            id="seekBar"
            value="0"
            min="0"
            max="100"
        >

        <span id="duration">00:00</span>

    </div>

    <!-- Controls -->

    <div id="controls">

        <button id="playBtn">
            ▶
        </button>

        <button id="pauseBtn">
            ❚❚
        </button>

        <button id="stopBtn">
            ■
        </button>

        <button id="fullscreenBtn">
            ⛶
        </button>

    </div>

    <!-- Volume -->

    <div id="volumeArea">

        🔊

        <input
            type="range"
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="1"
        >

    </div>

</div>

<!-- ===========================
BOTTOM PANEL
=========================== -->

<div id="bottomPanel">

    <div class="fileBox">

        <label>

            🎵 Select Audio

        </label>

        <input
            type="file"
            id="audioFile"
            accept="audio/*"
        >

    </div>

    <div class="fileBox">

        <label>

            🖼 Select Background

        </label>

        <input
            type="file"
            id="backgroundFile"
            accept="image/*"
        >

    </div>

</div>

<!-- ===========================
JAVASCRIPT
=========================== -->

<script src="effects/visualizer.js"></script>
<script src="effects/particles.js"></script>
<script src="effects/background.js"></script>
<script src="app.js"></script>

</body>
</html>
