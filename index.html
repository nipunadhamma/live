<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>නිපුණධම්ම</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 20px; text-align: center; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .grid { display: flex; gap: 20px; margin-bottom: 20px; }
    .box { flex: 1; background: #fffdf0; padding: 15px; border: 1px solid #e6dbb3; border-radius: 8px; min-height: 100px; }
    h2 { color: #555; font-size: 16px; margin-top: 0; }
    p { font-size: 18px; font-weight: bold; color: #333; margin: 10px 0 0 0; }
  </style>
</head>
<body>

  <div class="container">
    <h1>නිපුණධම්ම</h1>
    
    <div class="grid">
      <div class="box">
        <h2>📅 ළඟම එන පෝය දවස</h2>
        <p id="poya">වෙසක් පෝය</p>
      </div>
      <div class="box">
        <h2>🙏 දවසේ දහම් පණිවිඩය</h2>
        <p id="quote">තණ්හාය ජායතී සෝකෝ...</p>
      </div>
    </div>

    <div class="grid">
      <div class="box">
        <h2>☀️ හිරু උදාව</h2>
        <p id="sunrise">06:00 AM</p>
      </div>
      <div class="box">
        <h2>🌙 හිරু බැසීම</h2>
        <p id="sunset">06:15 PM</p>
      </div>
    </div>
  </div>

</body>
</html>
